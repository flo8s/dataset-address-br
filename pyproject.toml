[project]
name = "dataset-address-br"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.11.2",
    "dbt-duckdb>=1.10.0",
    "duckdb>=1.5.0,<1.5.3",
    "boto3>=1.35",
]

[tool.queria]
name = "address_br"
title = "アドレス・ベース・レジストリ"
description = """「アドレス・ベース・レジストリ（市区町村マスタデータ）」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
全国地方公共団体コード・都道府県・郡・市区町村・行政区の対応表を提供。"""
cover = "🏛️"
tags = ["住所", "マスタ", "地方公共団体コード", "デジタル庁"]
license = "デジタル庁利用規約"
license_url = "https://www.digital.go.jp/policies/base_registry_address_tos"
source_url = "https://dataset.address-br.digital.go.jp/"
repository_url = "https://github.com/flo8s/dataset-address-br"
schedule = "monthly"

[tool.queria.schemas.main]
title = "メイン"
