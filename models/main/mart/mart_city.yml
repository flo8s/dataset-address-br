version: 2

models:
  - name: mart_city
    description: |
      全国の市区町村マスタ。
      「アドレス・ベース・レジストリ（市区町村マスタデータ）」（デジタル庁）（https://dataset.address-br.digital.go.jp/）を加工して作成。
      政令指定都市は市レベルと区レベルの両方のレコードを含む。
    access: public
    columns:
      - name: lg_code
        data_type: varchar
      - name: lg_code_5
        data_type: varchar
      - name: pref_code
        data_type: varchar
      - name: pref_name
        data_type: varchar
      - name: pref_name_kana
        data_type: varchar
      - name: county_name
        data_type: varchar
      - name: city_name
        data_type: varchar
      - name: city_name_kana
        data_type: varchar
      - name: ward_name
        data_type: varchar
      - name: ward_name_kana
        data_type: varchar
      - name: is_designated_city_ward
        data_type: boolean
      - name: geometry
        data_type: geometry
      - name: efct_date
        data_type: date
